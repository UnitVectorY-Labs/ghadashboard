name: Integration Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: ghadashboard_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: localtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ghadashboard_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgres://postgres:localtest@127.0.0.1:5432/ghadashboard_test?sslmode=disable

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.4' # GOVERSION

      - name: Install dependencies
        run: go mod download

      - name: Run integration tests
        run: go test -race ./...

      - name: Run Go vet
        run: go vet ./...
